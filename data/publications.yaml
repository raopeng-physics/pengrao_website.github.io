# Selected publications shown on the Physics page (the full list lives on Google Scholar).
# Order here = order on the page. All fields except title and authors are optional.
#
#   area:        1 (2, 3, …) colours the stripe like that research area on the Physics page
#   volume, pages: shown as "Phys. Rev. B 112, 024440 (2025)"
#   figure:      a small image from the paper, put in static/figures/ (PNG or JPG, ~600 px wide is plenty)
#   figure_alt:  one-line description of the figure, for screen readers
selected:
  - title: "Dynamical response theory of interacting Majorana fermions and its application to generic Kitaev quantum spin liquids in a field"
    authors: "Peng Rao, Roderich Moessner, Johannes Knolle"
    journal: "Phys. Rev. B"
    volume: "112"
    pages: "024440"
    year: "2025"
    area: 1
    doi: "10.1103/f4b4-h1yr"
    figure: "/figures/fig_KQSL.png"
    figure_alt: "Inelastic neutron scattering of a generic Kitaev quantum spin liquid, showing sharp modes due to magnetic instabilites induced by non-Kitaev spin interactions."
    takeaway: "We developed a general framework of interacting Majorana fermions to compute the dynamical response of a Kitaev quantum spin liquid away from the solvable pure Kitaev limit."
  - title: 'Order-by-disorder in magnets with frustrated spin interactions - classical and large-$S$ limits via the spin functional integral'
    authors: "Peng Rao, Johannes Knolle"
    journal: "J. Phys.: Condens. Matter"
    volume: "37"
    pages: "405802"
    year: "2025"
    doi: "10.1088/1361-648X/ae0bdf"
    # figure: "/figures/rao2025order.png"
    # figure_alt: ""
    takeaway: "We formulated a functional integral approach to the order-by-disorder phenomena in frustrated magnets."
  - title: 'Berry phases of vison transport in $\mathbb{Z}_2$ topologically ordered states from exact fermion-flux lattice dualities'
    authors: "Chuan Chen, Peng Rao, Inti Sodemann"
    journal: "Phys. Rev. Research"
    volume: "4"
    pages: "043003"
    year: "2022"
    doi: "10.1103/PhysRevResearch.4.043003"
    # figure: "/figures/chen2022berry.png"
    # figure_alt: ""
    takeaway: 'We developed an exact duality between 2D spin-$1/2$ lattices to the Majorana fermions and vison quasiparticles (see also my PhD thesis), and studied the topology of the vison bands in extended Kitaev models.'
