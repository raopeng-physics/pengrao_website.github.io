baseURL = "https://raopeng-physics.github.io/"
languageCode = "en"
title = "Peng Rao"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Lecture notes live in content/notes/ but are served under /physics/notes/
[permalinks]
  [permalinks.page]
    notes = "/physics/notes/:slug/"
    writing = "/writing/:filename/"
  [permalinks.section]
    notes = "/physics/notes/"

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

# Keep LaTeX between $...$ / $$...$$ untouched by Markdown; KaTeX renders it in the browser
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    inline = [["$", "$"], ["\\(", "\\)"]]
    block = [["$$", "$$"], ["\\[", "\\]"]]

[params]
  name = "Peng Rao"
  tagline = "Theoretical condensed-matter physicist."
  affiliation = "Physics Department, Technical University of Munich"
  scholar = "https://scholar.google.com/citations?user=5MsEmIwAAAAJ&hl=en"
  orcid = "https://orcid.org/0000-0003-1250-0021"
  # Put your CV at static/files/cv.pdf (or change the path here)
  cv = "/files/cv.pdf"
  # Put a portrait at static/files/portrait.jpg and set: photo = "/files/portrait.jpg"
  photo = ""
  # Show the Writing tab and homepage card even before the first essay is published
  showWriting = true

  # PhD thesis, linked on the Physics page (remove this block to hide it)
  [params.thesis]
    title = 'Spin–anyon duality and $\mathbb{Z}_2$ topological order'
    institution = 'TU Dresden & MPI for the Physics of Complex Systems'
    year = '2022'
    pdf = '/files/PhD_thesis.pdf'

  # Topic colours for the Writing section. Each essay sets `topic:` in its front matter.
  # `partners` are the colours a second square may take next to the topic colour.
  [params.topics.Economics]
    color = "#F0A630"
    ink = "#8A5A12"
    partners = ["#C7442B", "#7A2E2A", "#6E7D2E", "#EE7A26"]
  [params.topics.Philosophy]
    color = "#1F7A9C"
    ink = "#1F6A88"
    partners = ["#6E7D2E", "#C9789A", "#24583A", "#DCD660"]
  # Used for any topic not listed above
  [params.topics.default]
    color = "#C7442B"
    ink = "#A33A24"
    partners = ["#F0A630", "#7A2E2A", "#2B8DB0", "#C9789A"]
