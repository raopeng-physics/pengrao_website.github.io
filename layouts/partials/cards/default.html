{{- /* Default link-preview card (1200×630) for every page that is not an essay: name, tagline and the homepage composition.
  Text block centred vertically on the left; the composition fits inside the right half with even margins. */ -}}
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
{{ partial "filters.html" . }}
<rect width="1200" height="630" fill="#F4EEE2"/>
<svg x="590" y="95" width="560" height="440" viewBox="-60 40 900 540" overflow="visible">{{ partial "compo.html" . }}</svg>
<text x="84" y="290" font-family="Jost" font-weight="600" font-size="100" fill="#1F1D1A">{{ site.Params.name }}</text>
<text x="88" y="350" font-family="Spectral" font-style="italic" font-size="32" fill="#3A3530">{{ site.Params.tagline }}</text>
{{ with site.Params.position }}<text x="88" y="392" font-family="IBM Plex Sans" font-weight="500" font-size="23" fill="#4A4540">{{ . }}</text>{{ end }}
</svg>
